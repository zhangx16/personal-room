server {
    listen 80;
    listen [::]:80;
    server_name room.031216.xyz;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name room.031216.xyz;
    ssl_certificate /etc/letsencrypt/live/room.031216.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/room.031216.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 128k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # These headers override any client-supplied proxy headers.
    location / {
        proxy_pass http://127.0.0.1:22836;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_hide_header X-Powered-By;
        proxy_read_timeout 30s;
    }
    # Cloudflare proxy is retained; never cache authenticated API responses.
    location /api/ {
        proxy_pass http://127.0.0.1:22836;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store" always;
    }
}
